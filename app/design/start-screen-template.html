<meta charset="utf-8">
<title>Lamp Start Screen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one full-screen dark stage; a single lamp at the centre whose light reveals the verse, the painting and the title. Single dark look by design. */
:root{
  --night:#05070F; --navy:#0B1328; --gold:#C9A24A; --gold-hi:#F5C451; --flame:#FFE7A3; --cream:#FBF8F0; --muted:rgba(243,233,206,.62);
  --display:ui-serif,"New York",Georgia,"Times New Roman",serif;
  --ui:-apple-system,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
@property --r{syntax:"<percentage>";inherits:false;initial-value:0%}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--cream);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;max-width:560px;margin:0 auto;overflow:hidden;background:var(--night);cursor:pointer}

/* the painting, revealed by a growing circle of light around the lamp */
#paint{position:absolute;inset:0;background:url(__BG__) center/cover no-repeat;opacity:0;filter:brightness(.55) saturate(.8);
  -webkit-mask-image:radial-gradient(circle at 40% 46%,#000 calc(var(--r) - 18%),transparent var(--r));mask-image:radial-gradient(circle at 40% 46%,#000 calc(var(--r) - 18%),transparent var(--r));
  transition:--r 3.2s cubic-bezier(.3,.1,.2,1),opacity 1.2s ease,filter 3s ease}
#stage.reveal #paint{--r:150%;opacity:1;filter:brightness(.92) saturate(1)}
#shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(5,7,15,.15) 0%,rgba(5,7,15,0) 40%,rgba(5,7,15,.2) 60%,rgba(5,7,15,.88) 100%)}

/* glow around the flame (lives inside #lamp, centred on the wick hole) */
#glow{position:absolute;left:var(--fx);top:var(--fy);width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(circle,rgba(255,214,120,.55) 0%,rgba(245,196,81,.18) 35%,rgba(245,196,81,0) 70%);
  transition:width 2.4s cubic-bezier(.2,.7,.2,1),height 2.4s cubic-bezier(.2,.7,.2,1),opacity 1s;opacity:0}
#stage.lit #glow{width:min(150vw,820px);height:min(150vw,820px);opacity:1;animation:breathe 3.4s ease-in-out 2.4s infinite}
@keyframes breathe{50%{opacity:.82}}

canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* the lamp: Richard's clay oil lamp painting; the app adds the flame at the wick hole */
#lamp{--fx:19.5%;--fy:68%;position:absolute;left:50%;top:46%;width:min(66vw,300px);aspect-ratio:700/464;transform:translate(-50%,-40%);transition:top 1.6s cubic-bezier(.4,0,.2,1),width 1.6s cubic-bezier(.4,0,.2,1)}
#clay,#warm{position:absolute;inset:0;width:100%;height:100%;display:block}
#clay{filter:brightness(.42) saturate(.55) drop-shadow(0 10px 18px rgba(0,0,0,.7));transition:filter 1.4s ease}
#stage.lit #clay{filter:brightness(1.02) saturate(1.05) drop-shadow(0 12px 22px rgba(0,0,0,.75))}
#warm{background:radial-gradient(circle at var(--fx) 40%,rgba(255,200,110,.95) 0%,rgba(255,150,60,.45) 22%,rgba(255,120,40,.12) 48%,transparent 75%);
  mix-blend-mode:screen;-webkit-mask:url(__LAMP__) center/100% 100% no-repeat;mask:url(__LAMP__) center/100% 100% no-repeat;opacity:0;transition:opacity 1.2s ease .3s}
#stage.lit #warm{opacity:.6;animation:warm 2.2s ease-in-out 1.6s infinite}
@keyframes warm{50%{opacity:.48}}
#flame{position:absolute;left:var(--fx);bottom:calc(100% - var(--fy));width:26%;aspect-ratio:200/412;transform:translate(-50%,14%) scale(0);transform-origin:50% 86%;transition:transform 1.1s cubic-bezier(.2,1.2,.4,1);pointer-events:none}
#flame img{width:100%;height:100%;display:block}
#stage.lit #flame{transform:translate(-50%,14%) scale(1)}
#stage.title #lamp{top:58%;width:min(30vw,132px)}
#stage.title #glow{width:min(90vw,460px);height:min(90vw,460px)}

/* text */
.verse{position:absolute;left:0;right:0;top:61%;padding:0 max(28px,env(safe-area-inset-left,0px));text-align:center;font:600 clamp(23px,6.6vw,30px)/1.45 var(--display);color:var(--cream);text-shadow:0 2px 18px rgba(0,0,0,.85);transition:opacity 1s,top 1.6s cubic-bezier(.4,0,.2,1)}
.verse span{opacity:0;display:inline-block;transform:translateY(8px);transition:opacity .9s ease,transform .9s ease}
.verse span.on{opacity:1;transform:none}
.verse .ref{display:block;margin-top:12px;transform:none;font:700 12px/1 var(--ui);letter-spacing:.22em;text-transform:uppercase;color:var(--gold);opacity:0;transition:opacity 1s}
.verse .ref.on{opacity:1}
#stage.title .verse{opacity:0;top:58%}

.titleblock{position:absolute;left:0;right:0;top:66%;text-align:center;padding:0 24px;pointer-events:none}
.word{font:700 clamp(54px,16.5vw,92px)/1 var(--display);letter-spacing:.2em;margin-right:-.2em;white-space:nowrap;color:transparent;
  background:linear-gradient(100deg,#8C6A22 0%,#E9C66B 30%,#FFF1C2 46%,#E9C66B 58%,#9A7722 100%);background-size:250% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;
  opacity:0;transform:translateY(18px) scale(.97);filter:drop-shadow(0 4px 22px rgba(245,196,81,.35));transition:opacity 1.4s ease,transform 1.6s cubic-bezier(.2,.8,.2,1)}
#stage.title .word{opacity:1;transform:none;animation:shine 3.2s ease 1s forwards}
@keyframes shine{to{background-position:0 0}}
.tag{margin-top:0;text-shadow:0 2px 12px rgba(0,0,0,.9);font:600 clamp(15px,4.2vw,18px)/1.5 var(--display);font-style:italic;color:var(--gold-soft,#F3E9CE);opacity:0;transition:opacity 1.2s ease 1.2s}
.tag b{display:block;font:700 clamp(18px,5.3vw,25px)/1.15 var(--display);font-style:normal;letter-spacing:.09em;margin-right:-.09em;text-transform:uppercase;color:var(--gold-hi);white-space:nowrap;text-shadow:0 2px 14px rgba(0,0,0,.95),0 0 18px rgba(245,196,81,.25);margin-bottom:14px}
#stage.title .tag{opacity:1}

.cta{position:absolute;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);min-width:min(78vw,320px);min-height:54px;border:none;border-radius:999px;
  background:linear-gradient(180deg,#E3BC5C,#C9A24A);color:#141A33;font:800 17px/1 var(--ui);letter-spacing:.02em;box-shadow:0 10px 30px rgba(201,162,74,.35),inset 0 1px 0 rgba(255,255,255,.4);cursor:pointer;opacity:0;pointer-events:none;transition:opacity 1s ease 2s,transform 1s ease 2s}
#stage.title .cta{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.small{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font:600 12.5px/1.4 var(--ui);color:var(--muted);opacity:0;transition:opacity 1s ease 2.6s}
#stage.title .small{opacity:1}
.credit{font:600 13px/1.6 var(--display);font-style:italic;letter-spacing:.03em;color:rgba(243,233,206,.8)}
.small button{background:none;border:none;color:var(--gold);font:inherit;text-decoration:underline;cursor:pointer;padding:6px}

#prompt{position:absolute;left:0;right:0;top:66%;text-align:center;font:600 clamp(16px,4.6vw,19px)/1.4 var(--display);font-style:italic;color:var(--muted);letter-spacing:.04em;animation:pulse 2.6s ease-in-out infinite;transition:opacity .6s}
#prompt small{display:block;margin-top:8px;font:700 10.5px/1 var(--ui);font-style:normal;letter-spacing:.3em;text-transform:uppercase;color:rgba(201,162,74,.6)}
@keyframes pulse{50%{opacity:.45}}
#stage.lit #prompt{opacity:0;animation:none}
.skip{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));background:rgba(255,255,255,.06);border:1px solid rgba(201,162,74,.3);color:var(--muted);border-radius:999px;padding:7px 13px;font:700 12px/1 var(--ui);letter-spacing:.06em;cursor:pointer;opacity:0;transition:opacity .6s}
#stage.lit:not(.title) .skip{opacity:1}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--cream);color:#141A33;padding:12px 18px;border-radius:14px;font:700 14px/1.4 var(--ui);text-align:center;max-width:80%;opacity:0;pointer-events:none;transition:opacity .3s}
.toast.on{opacity:1}
button:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
@media (max-height:720px){#stage.title #lamp{top:51%;width:min(26vw,112px)}.titleblock{top:59%}.cta{bottom:calc(62px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>

<div id="stage" role="application" aria-label="Lamp start screen">
  <div id="paint" aria-hidden="true"></div>
  <div id="shade" aria-hidden="true"></div>
  <canvas id="embers" aria-hidden="true"></canvas>
  <div id="lamp" aria-hidden="true">
    <div id="glow"></div>
    <img id="clay" src="__LAMP__" alt="">
    <div id="warm"></div>
    <div id="flame"><img src="__FLAME__" alt=""></div>
  </div>

  <div id="prompt">Tap to light the lamp<small>Lamp · Bible Word Puzzle</small></div>

  <div class="verse" id="verse" aria-live="polite"></div>

  <div class="titleblock">
    <div class="tag"><b>Genesis to Revelation</b>Sixty-six books. One story.<br>Your journey begins.</div>
  </div>
  <button class="cta" id="begin">Begin the journey</button>
  <div class="small"><span class="credit">Created by Richard J. Allinson</span><br>Preview · <button id="replay">Play it again</button></div>
  <button class="skip" id="skip" aria-label="Skip">Skip</button>
  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
  var stage=document.getElementById('stage'), verse=document.getElementById('verse');
  var WORDS=['Thy word is a lamp','unto my feet,','and a light','unto my path.'];
  var timers=[], started=false, sndData='__SND__', ctx=null, buf=null;
  function later(fn,ms){timers.push(setTimeout(fn,ms));}
  function clear(){timers.forEach(clearTimeout);timers=[];}
  function sound(){
    try{
      ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
      if(ctx.state==='suspended')ctx.resume();
      var play=function(){var s=ctx.createBufferSource(),g=ctx.createGain();g.gain.value=.9;s.buffer=buf;s.connect(g).connect(ctx.destination);s.start();};
      if(buf){play();return;}
      var bin=atob(sndData.split(',')[1]),u8=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
      ctx.decodeAudioData(u8.buffer,function(b){buf=b;play();},function(){});
    }catch(e){}
  }
  function buildVerse(){
    verse.innerHTML=WORDS.map(function(w){return '<span>'+w+'</span>';}).join(' ')+'<span class="ref">Psalm 119:105</span>';
  }
  function light(){
    if(started)return; started=true;
    stage.classList.add('lit'); sound(); embers.start();
    var spans=verse.querySelectorAll('span:not(.ref)');
    spans.forEach(function(s,i){later(function(){s.classList.add('on');},1400+i*650);});
    later(function(){verse.querySelector('.ref').classList.add('on');},1400+spans.length*650+200);
    later(function(){stage.classList.add('reveal');},2600);
    later(function(){stage.classList.add('title');},6600);
  }
  function skip(){
    clear(); started=true; stage.classList.add('lit','reveal','title'); embers.start();
    verse.querySelectorAll('span').forEach(function(s){s.classList.add('on');});
  }
  function reset(){
    clear(); started=false; stage.className=''; buildVerse(); embers.stop();
  }
  stage.addEventListener('click',function(e){ if(e.target.closest('button'))return; if(!started)light(); else if(!stage.classList.contains('title'))skip(); });
  document.getElementById('skip').addEventListener('click',function(e){e.stopPropagation();skip();});
  document.getElementById('replay').addEventListener('click',function(e){e.stopPropagation();reset();});
  document.getElementById('begin').addEventListener('click',function(e){
    e.stopPropagation(); var t=document.getElementById('toast');
    t.textContent='In the app, this opens the Journey at Genesis.'; t.classList.add('on'); setTimeout(function(){t.classList.remove('on');},2200);
  });

  /* embers: warm sparks drifting up from the flame */
  var embers=(function(){
    var cv=document.getElementById('embers'), c=cv.getContext('2d'), ps=[], run=false, raf=0, W=0, H=0, dpr=1;
    function size(){dpr=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;c.setTransform(dpr,0,0,dpr,0,0);}
    function spawn(){var f=document.getElementById('flame').getBoundingClientRect(),st=stage.getBoundingClientRect();
      return {x:f.left-st.left+f.width*(.44+Math.random()*.12),y:f.top-st.top+f.height*.14,vx:(Math.random()-.5)*.35,vy:-(.35+Math.random()*.9),life:0,max:180+Math.random()*200,r:.6+Math.random()*1.6};}
    function tick(){c.clearRect(0,0,W,H);
      if(run&&ps.length<70&&Math.random()<.5)ps.push(spawn());
      ps=ps.filter(function(p){p.life++;p.x+=p.vx+Math.sin((p.life+p.r*40)/22)*.25;p.y+=p.vy;var a=1-p.life/p.max;if(a<=0)return false;
        c.beginPath();c.fillStyle='rgba(255,'+Math.round(190+50*a)+','+Math.round(110*a)+','+(a*.85).toFixed(3)+')';c.shadowColor='rgba(255,200,90,.9)';c.shadowBlur=8;c.arc(p.x,p.y,p.r,0,6.283);c.fill();return true;});
      if(run||ps.length)raf=requestAnimationFrame(tick);}
    window.addEventListener('resize',size);
    return {start:function(){if(run)return;size();run=true;cancelAnimationFrame(raf);tick();},stop:function(){run=false;ps=[];c.clearRect(0,0,W,H);}};
  })();
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){embers.start=function(){};}
  buildVerse();
})();
</script>
