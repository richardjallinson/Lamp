<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<script>
/* iPad (v5r): lay the page out about 430 x 900 and let iOS scale it to fill the window. Done with the viewport tag,
   so iOS re-fits the layout to the screen; taps and drags line up as on a phone. Phones (narrow windows) are left alone. */
(function () {
  var meta = document.querySelector('meta[name=viewport]'), cur = 1;
  function fit() {
    var vv = window.visualViewport, s = (vv && vv.scale) || cur;
    var W = Math.round(window.innerWidth * s), H = Math.round(window.innerHeight * s);   /* the window, in points */
    var z = Math.min(W / 430, H / 900);
    z = Math.max(1, Math.min(1.8, Math.floor(z * 20) / 20));
    if (Math.min(W, H) < 600) z = 1;                                                       /* a phone, or a narrow iPad window */
    var c = z === 1 ? 'width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no'
      : 'width=' + Math.round(W / z) + ', initial-scale=' + z + ', minimum-scale=' + z + ', maximum-scale=' + z + ', viewport-fit=cover, user-scalable=no';
    if (meta.getAttribute('content') !== c) { meta.setAttribute('content', c); cur = z; document.documentElement.style.setProperty('--lampzoom', z); }
  }
  fit();
  var t; function later() { clearTimeout(t); t = setTimeout(fit, 120); }
  window.addEventListener('resize', later); window.addEventListener('orientationchange', later);
  window.LampFit = fit;
})();
</script>
