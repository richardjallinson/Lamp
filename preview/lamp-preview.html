<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lamp Level Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Figtree:wght@500;700;800&display=swap">
<style>
/* Layout: one full-screen painting; verse board above, letter wheel below, quiet glass controls. Single dark look by design. */
:root{
  --night:#0B1328;
  --navy:#141A33;
  --glass:rgba(12,18,40,.62);
  --gold:#C9A24A;
  --gold-soft:#F3E9CE;
  --cream:#FBF8F0;
  --ink:#141A33;
  --muted:rgba(243,233,206,.72);
  --ok:#8FC79E;
  --display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --ui:"Figtree",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--gold-soft);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;top:0;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;overflow:clip;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));box-sizing:border-box;
  background:var(--night) center/cover no-repeat}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(8,13,30,.78) 0%,rgba(8,13,30,.35) 22%,rgba(8,13,30,.15) 42%,rgba(8,13,30,.35) 62%,rgba(8,13,30,.82) 100%)}
#app>*:not(.sheet):not(.toast):not(#bg){position:relative}
#bg{position:absolute;inset:0;background:var(--night) center/cover no-repeat;transition:filter 1.4s ease;filter:brightness(.3) saturate(.55)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;background:var(--glass);border:1px solid rgba(201,162,74,.45);color:var(--gold-soft);font:800 14px/1 var(--ui);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
button.pill{cursor:pointer}
.oil svg{width:18px;height:18px}
.ttl{text-align:center;margin-top:12px;font:600 13px/1.2 var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--gold-soft);text-shadow:0 1px 6px rgba(0,0,0,.8)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(243,233,206,.3)}
.dots i.on{background:var(--gold)}
.dots i.done{background:var(--gold-soft)}
.board{margin:14px auto 0;width:100%;max-width:440px;padding:16px 16px 14px;border-radius:16px;background:var(--glass);border:1px solid rgba(201,162,74,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-sizing:border-box}
.verse{font:600 24px/1.55 var(--display);color:var(--cream);text-align:center;text-wrap:balance}
.blank{display:inline-flex;gap:3px;vertical-align:-5px;margin:0 2px}
.blank b{width:22px;height:28px;border-radius:5px;background:rgba(251,248,240,.12);border:1px solid rgba(243,233,206,.45);display:inline-flex;align-items:center;justify-content:center;font:800 17px/1 var(--ui);color:var(--ink)}
.blank b.f{background:var(--cream);border-color:var(--cream);animation:pop .35s ease}
.blank b.h{background:rgba(201,162,74,.9);border-color:var(--gold)}
.ref{margin-top:8px;text-align:center;font:700 12px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.spacer{flex:1}
.wordrow{display:flex;align-items:center;justify-content:center;gap:12px}
.mini{width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(201,162,74,.75);background:var(--glass);color:var(--gold-soft);font:800 18px/1 var(--ui);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .15s}
.mini.on{opacity:1;pointer-events:auto}
.mini.go{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.mini:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
.word{min-width:120px;height:40px;text-align:center;font:800 28px/40px var(--ui);letter-spacing:.14em;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.word.bad{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.wheelwrap{display:flex;justify-content:center;margin-top:6px}
#wheel{position:relative;width:min(62vw,240px,34vh);aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--glass);border:2px solid rgba(201,162,74,.8);touch-action:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#wheel svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lt{position:absolute;width:23%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 clamp(24px,8vw,32px)/1 var(--ui);color:var(--gold-soft);transition:background .12s,color .12s}
.lt.sel{background:var(--gold);color:var(--navy)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:10px;margin-bottom:16px;padding:0 6px}
.round{width:52px;height:52px;border-radius:50%;background:var(--glass);border:1.5px solid rgba(201,162,74,.75);color:var(--gold-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.round svg{width:24px;height:24px}
.round small{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font:700 10.5px/1 var(--ui);color:var(--muted);white-space:nowrap}
.round:focus-visible,.pill:focus-visible,.cta:focus-visible,.tile:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
.toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);padding:9px 16px;border-radius:999px;background:var(--cream);color:var(--ink);font:800 14px/1 var(--ui);box-shadow:0 6px 20px rgba(0,0,0,.4);opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
/* recall level */
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.tile{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid rgba(201,162,74,.6);background:var(--glass);color:var(--cream);font:700 19px/1 var(--display);cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.tile.used{visibility:hidden}
.tile.bad{animation:shake .35s;border-color:#E0806F}
.built{min-height:2.9em}
.ghost{color:rgba(243,233,206,.32)}
.howto{margin-top:10px;text-align:center;font:600 13.5px/1.4 var(--ui);color:var(--muted)}
/* sheets */
.sheet{position:absolute;inset:0;z-index:5;display:flex;align-items:flex-end;justify-content:center;background:rgba(6,10,24,.55);padding:0 max(12px,env(safe-area-inset-left,0px)) max(12px,env(safe-area-inset-bottom,0px))}
.card{width:100%;max-width:460px;border-radius:20px;background:var(--cream);color:var(--ink);padding:20px 18px 18px;box-sizing:border-box;box-shadow:0 -6px 30px rgba(0,0,0,.45);animation:up .35s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.card h2{margin:0;font:700 28px/1.1 var(--display);color:var(--navy);text-wrap:balance}
.card .kick{font:800 11px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:#9A7722;margin-bottom:6px}
.card .v{margin:12px 0 4px;font:600 21px/1.45 var(--display);color:var(--navy)}
.card .v mark{background:rgba(201,162,74,.28);color:inherit;border-radius:3px;padding:0 2px}
.card .r{font:700 12px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:#6B6F7E}
.card .note{margin-top:12px;padding:10px 12px;border-radius:10px;background:#F2ECDC;font:500 14px/1.45 var(--ui);color:#3A3F55}
.card .note b{color:var(--navy)}
.thumb{display:flex;gap:12px;align-items:center;margin-top:12px}
.thumb div:first-child{width:64px;height:86px;border-radius:8px;background:var(--night) center/cover;box-shadow:0 0 0 2px var(--gold),0 4px 12px rgba(0,0,0,.25);flex:0 0 auto}
.thumb p{margin:0;font:600 14px/1.4 var(--ui);color:#3A3F55}
.pick{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:8px;border:1px solid #E2DAC4;border-radius:12px;background:#fff;cursor:pointer;text-align:left;font-family:var(--ui)}
.pick span{width:46px;height:62px;border-radius:7px;background:var(--night) center/cover;flex:0 0 auto}
.pick b{display:block;font:700 19px/1.15 var(--display);color:var(--navy)}
.pick small{display:block;margin-top:3px;font:600 12px/1.2 var(--ui);color:#6B6F7E}
.pick:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.pill.streak svg,.lampcard svg,.wd svg,.note svg{width:18px;height:18px;vertical-align:-3px}
.pill.streak{filter:drop-shadow(0 0 6px rgba(245,196,81,.55))}
.pill.streak.dim{filter:none;opacity:.75}
.pill.streak.dim svg{filter:grayscale(1) brightness(.7)}
.lampcard{display:flex;align-items:center;gap:12px;margin-top:4px;padding:12px;border-radius:12px;background:var(--navy);color:var(--gold-soft)}
.lampcard .big{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(245,196,81,.45),rgba(245,196,81,0) 70%)}
.lampcard .big svg{width:32px;height:32px}
.lampcard .big.dim{background:none}.lampcard .big.dim svg{filter:grayscale(1) brightness(.6)}
.lampcard b{display:block;font:700 20px/1.1 var(--display);color:#fff}
.lampcard small{display:block;margin-top:3px;font:600 12.5px/1.35 var(--ui);color:rgba(243,233,206,.8)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;font:700 11px/1 var(--ui);color:#6B6F7E}
.wd i{width:30px;height:30px;border-radius:50%;border:1.5px solid #D9D2BF;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:15px;color:#6B6F7E}
.wd.on i{background:var(--navy);border-color:var(--navy)}
.wd.rest i{background:#ECE6D6;border-style:dashed}
.wd.now i{border-color:var(--gold);border-width:2px}
.wd.later i{opacity:.45}
.pick.daily{border-color:var(--gold);background:#FFFBEF}
.share{margin-top:12px;padding:12px;border-radius:10px;border:1px dashed #C9A24A;font:700 15px/1.5 var(--ui);color:var(--navy);-webkit-user-select:text;user-select:text}
.test{display:block;width:100%;margin-top:12px;border:none;background:none;color:#9A7722;font:700 12.5px/1.2 var(--ui);text-decoration:underline;cursor:pointer;padding:6px}
.cta{margin-top:16px;width:100%;min-height:50px;border:none;border-radius:12px;background:var(--navy);color:#fff;font:800 16px/1 var(--ui);cursor:pointer}
.cta.alt{background:transparent;color:var(--navy);border:1px solid #D9D2BF;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<div id="app">
  <div id="bg" aria-hidden="true"></div>
  <div class="top">
    <button class="pill" id="book" aria-label="Choose a story">‹ Genesis</button>
    <span class="pill streak" id="streak" aria-label="Lamp streak"></span>
    <span class="pill oil" id="oil" aria-label="Lamp oil"></span>

  <div class="ttl" id="ttl"></div>
  <div class="dots" id="dots" aria-hidden="true"></div>
  <div class="board" id="board"></div>
  <div class="spacer"></div>
  <div id="play"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

 if(L.recall){const words=VERSE.slice(0,S.built).join(" ");const rest=VERSE.slice(S.built).map(w=>w.replace(/[A-Za-z]/g,"_")).join(" ");
  $("board").innerHTML='<div class="verse built">'+words+(S.built?" ":"")+'<span class="ghost">'+rest+'</span></div><div class="ref">'+curV().ref+' · from memory</div>';return}
 $("board").innerHTML='<div class="verse">'+boardHTML(L)+'</div><div class="ref">'+curV().ref+'</div>';
}
/* ---------- wheel level ---------- */
let letters=[],sel=[],drag=false,moved=false,downHit=null,undoTap=false,demoT=[];
function renderWheelLevel(){
 const L=LEVELS[S.lv];letters=L.wheel.split("");sel=[];
 $("play").innerHTML='<div class="howto" id="howto">'+(L.tip||(L.hide.length>1?L.hide.length+' words are missing. Find them all.':'One word is missing.'))+'</div><div class="wordrow"><button class="mini" id="bClr" aria-label="Clear letters">✕</button><div class="word" id="word"></div><button class="mini go" id="bGo" aria-label="Check word">✓</button></div><div class="wheelwrap"><div id="wheel" role="application" aria-label="Letter wheel"><svg id="lines"></svg></div></div>'+
 '<div class="bar"><button class="round" id="bHint" aria-label="Hint, costs one drop of oil">'+ICON.hint+'<small>Hint · 1</small></button><button class="round" id="bShuf" aria-label="Shuffle letters">'+ICON.shuffle+'<small>Shuffle</small></button><button class="round" id="bBonus" aria-label="Bonus words found">'+ICON.bonus+'<small id="bc">Bonus 0</small></button></div>';
 placeLetters();
 const wh=$("wheel");
 wh.addEventListener("pointerdown",e=>{stopDemo();drag=true;moved=false;undoTap=false;wh.setPointerCapture(e.pointerId);const h=hitAt(e);downHit=h;
  if(h!=null){if(sel.length&&sel[sel.length-1]===h)undoTap=true;else if(!sel.includes(h))sel.push(h)}drawSel()});
 wh.addEventListener("pointermove",e=>{if(!drag)return;const h=hitAt(e);if(h!=null&&h!==downHit)moved=true;
  if(moved&&h!=null){if(sel[sel.length-2]===h)sel.pop();else if(!sel.includes(h))sel.push(h)}const p=localPt(e);drawSel(moved?p[0]:null,moved?p[1]:null)});
 const end=()=>{if(!drag)return;drag=false;if(moved){submit()}else{if(undoTap)sel.pop();drawSel()}};
 wh.addEventListener("pointerup",end);wh.addEventListener("pointercancel",end);
 $("bGo").onclick=()=>{stopDemo();submit()};$("bClr").onclick=()=>{stopDemo();sel=[];drawSel()};
 $("bHint").onclick=hint;$("bShuf").onclick=()=>{stopDemo();sel=[];for(let i=letters.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[letters[i],letters[j]]=[letters[j],letters[i]]}placeLetters();drawSel()};
 $("bBonus").onclick=()=>toast(S.bonusFound.length?"Bonus: "+S.bonusFound.join(", ").toLowerCase():"No bonus words yet");
 $("bc").textContent="Bonus "+S.bonusFound.length;
 drawSel();
 if(S.lv===0&&!S.demoSeen){S.demoSeen=true;const tryDemo=()=>document.querySelector(".sheet")?setTimeout(tryDemo,400):demo();setTimeout(tryDemo,700)}
}
function demo(){
 const w=LEVELS[S.lv].hide[0];let i=0;sel=[];if(!$("wheel"))return;
 const step=()=>{if(i<w.length){sel.push(letters.indexOf(w[i]));i++;drawSel();demoT.push(setTimeout(step,450))}else{demoT.push(setTimeout(()=>{sel=[];drawSel();toast("Now you try")},900))}};
 $("howto").textContent="Watch: tap "+w.split("").join(", ")+" in order, then \u2713.";step();
}
function stopDemo(){if(demoT.length){demoT.forEach(clearTimeout);demoT=[];sel=[];$("howto").textContent=LEVELS[S.lv].tip||''}}
function localPt(e){const r=$("wheel").getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
function hitAt(e){const r=$("wheel").getBoundingClientRect(),x=e.clientX,y=e.clientY;let best=null;
 $("wheel").querySelectorAll(".lt").forEach(n=>{const b=n.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2;if(Math.hypot(x-cx,y-cy)<b.width*.62)best=+n.dataset.i});return best}
function placeLetters(){
 const wh=$("wheel");wh.querySelectorAll(".lt").forEach(n=>n.remove());
 letters.forEach((c,i)=>{const a=-Math.PI/2+i*2*Math.PI/letters.length,d=document.createElement("div");d.className="lt";d.textContent=c;d.style.left=(50+34*Math.cos(a))+"%";d.style.top=(50+34*Math.sin(a))+"%";d.dataset.i=i;wh.appendChild(d)});
}
function drawSel(px,py){
 const wh=$("wheel");if(!wh)return;const r=wh.getBoundingClientRect(),nodes=[...wh.querySelectorAll(".lt")];
 nodes.forEach(n=>n.classList.toggle("sel",sel.includes(+n.dataset.i)));
 const pts=sel.map(i=>{const b=nodes[i].getBoundingClientRect();return[b.left+b.width/2-r.left,b.top+b.height/2-r.top]});
 if(drag&&pts.length&&px!=null)pts.push([px,py]);
 $("lines").setAttribute("viewBox","0 0 "+r.width+" "+r.height);
 $("lines").innerHTML=pts.length>1?'<polyline points="'+pts.map(p=>p.join(",")).join(" ")+'" fill="none" stroke="#C9A24A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>':"";
 $("word").textContent=sel.map(i=>letters[i]).join("");
 const on=sel.length>0;$("bGo").classList.toggle("on",on&&!demoT.length);$("bClr").classList.toggle("on",on&&!demoT.length);
}
function submit(){
 const w=sel.map(i=>letters[i]).join(""),L=LEVELS[S.lv];sel=[];drawSel();
 if(!w)return;
 const wd=$("word");wd.textContent=w;
 if(L.hide.includes(w)){if(S.found.includes(w)){toast("Already found");}else{S.found.push(w);renderBoard();toast("✓ "+w.toLowerCase());if(L.hide.every(x=>S.found.includes(x)))setTimeout(levelDone,650)}}
 else if(L.bonus.includes(w)){if(S.bonusFound.includes(w))toast("Already found");else{S.bonusFound.push(w);S.oil++;renderTop();$("bc").textContent="Bonus "+S.bonusFound.length;toast("Bonus word · +1 oil")}}
 else{wd.classList.remove("bad");void wd.offsetWidth;wd.classList.add("bad");toast(w.length<2?"Too short":"Not in this level")}
 setTimeout(()=>{if($("word")&&!sel.length)$("word").textContent=""},700);
}
function hint(){
 const L=LEVELS[S.lv],t=L.hide.find(x=>!S.found.includes(x));if(!t)return;
 if(S.oil<1){toast("Out of oil. Find bonus words to earn more");return}
 S.oil--;S.hintsUsed=(S.hintsUsed||0)+1;S.hints[t]=(S.hints[t]||0)+1;if(S.hints[t]>=t.length){S.found.push(t)}renderTop();renderBoard();
 if(L.hide.every(x=>S.found.includes(x)))setTimeout(levelDone,650);
}
/* ---------- recall level ---------- */
function renderRecall(){
 if(!S.order.length){const L=LEVELS[S.lv];S.built=L.from||0;S.order=VERSE.map((w,i)=>i).filter(i=>i>=S.built);for(let i=S.order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[S.order[i],S.order[j]]=[S.order[j],S.order[i]]}}
 $("play").innerHTML='<div class="howto">'+(LEVELS[S.lv].tip||'Now say it from memory. Tap the words in order.')+'</div><div class="tiles" id="tiles">'+S.order.map(i=>'<button class="tile'+(i<S.built?" used":"")+'" data-i="'+i+'">'+VERSE[i].replace(/[^A-Za-z]/g,"")+'</button>').join("")+'</div><div style="height:22px"></div>';
 $("tiles").onclick=e=>{const b=e.target.closest(".tile");if(!b)return;const i=+b.dataset.i,need=VERSE[S.built];
  if(norm(VERSE[i])===norm(need)){const twin=[...$("tiles").children].find(x=>!x.classList.contains("used")&&norm(VERSE[+x.dataset.i])===norm(need));(twin||b).classList.add("used");S.built++;renderBoard();if(S.built===VERSE.length)setTimeout(finish,500)}
  else{b.classList.remove("bad");void b.offsetWidth;b.classList.add("bad")}};
}
/* ---------- flow ---------- */
/* ---------- painting light ---------- */
function lit(frac,instant){const b=$("bg");if(!b)return;if(instant){b.style.transition="none";requestAnimationFrame(()=>b.style.transition="")}
 const v=.3+.7*Math.max(0,Math.min(1,frac));b.style.filter="brightness("+v.toFixed(2)+") saturate("+(.55+.45*frac).toFixed(2)+")"}
/* ---------- lamp streak (test: stored on this phone only) ---------- */
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dayAdd=(k,n)=>{const d=new Date(k+"T12:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const weekOf=k=>{const d=new Date(k+"T12:00:00");return dayAdd(k,-d.getDay())};
function getDays(){try{return JSON.parse(localStorage.getItem("lamp-days")||"[]")}catch(e){return window.__lampDays||[]}}
function setDays(a){window.__lampDays=a;try{localStorage.setItem("lamp-days",JSON.stringify(a))}catch(e){}}
function streak(){const set=new Set(getDays()),t=today(),y=dayAdd(t,-1);let k=set.has(t)?t:y,n=0,rest={},restDays=[];
 for(let g=0;g<1000;g++){if(set.has(k)){n++;k=dayAdd(k,-1);continue}
  const prev=dayAdd(k,-1),w=weekOf(k);if((n>0||k===y)&&!rest[w]&&set.has(prev)){rest[w]=1;restDays.push(k);k=prev;continue}break}
 return{n,lit:set.has(t),restDays}}
function markPlayed(){const a=getDays(),t=today();if(a.includes(t))return false;a.push(t);setDays(a);renderStreak();return true}
function renderStreak(){const s=streak();$("streak").innerHTML=LAMPI+'<span>'+(s.n?(s.n===1?"Day 1":s.n+" days"):"Light it")+'</span>';$("streak").classList.toggle("dim",!s.lit)}
function weekRow(){const set=new Set(getDays()),s=streak(),t=today(),w0=weekOf(t);let h="";
 for(let i=0;i<7;i++){const k=dayAdd(w0,i),lbl="SMTWTFS"[i],cls=set.has(k)?"on":s.restDays.includes(k)?"rest":k===t?"now":k>t?"later":"";
  h+='<span class="wd '+cls+'"><i>'+(set.has(k)?LAMPI:s.restDays.includes(k)?"☾":"")+'</i>'+lbl+'</span>'}return h}
/* ---------- flow ---------- */
function levelDone(){
 const L=LEVELS[S.lv],marked=VERSE.map(w=>L.hide.includes(norm(w))?"<mark>"+w.replace(/[^A-Za-z]/g,"")+"</mark>"+w.replace(/[A-Za-z]/g,""):w).join(" ");
 lit((S.lv+1)/LEVELS.length);
 const first=markPlayed();
 if(ST().daily){setTimeout(()=>shareCard(first),900);return}
 setTimeout(()=>sheet('<div class="kick">Level '+(S.lv+1)+' complete</div><h2>Well done</h2><div class="v">'+marked+'</div><div class="r">'+curV().ref+' · KJV</div>'+(first?'<div class="note">'+LAMPI+' <b>Your lamp is lit for today.</b> '+streakLine()+'</div>':"")+(S.bonusFound.length?'<div class="note">Bonus words so far: <b>'+S.bonusFound.join(", ").toLowerCase()+'</b></div>':"")+'<button class="cta" id="next">'+(S.lv+2===LEVELS.length?"Final level: from memory":"Next level")+'</button>',()=>{S.lv++;S.found=[];S.hints={};start()}),first?900:900);
}
function streakLine(){const n=streak().n;return n>1?n+" days in a row. One rest day a week never breaks it.":"Come back tomorrow to keep it burning. One rest day a week never breaks it."}
function finish(){
 const st=ST(),nx=STORIES[SI+1]&&!STORIES[SI+1].daily?STORIES[SI+1]:null;lit(1);
 setTimeout(()=>sheet('<div class="kick">Story complete</div><h2>'+st.title+'</h2><div class="v">“'+st.verse.join(" ")+'”</div><div class="r">'+st.ref+' · KJV</div><div class="note"><b>Why it matters.</b> '+st.note+'</div><div class="thumb"><div role="img" aria-label="'+st.title+' painting" style="background-image:url('+st.img+')"></div><p>The painting is fully lit and added to your collection.'+(nx?' Next story: <b>'+nx.title+'</b>.':'')+'</p></div><button class="cta" id="next">'+(nx?"Play next story":"Choose a story")+'</button>',()=>{nx?go(SI+1):chooser()}),1300);
}
function shareCard(first){
 const secs=Math.round((Date.now()-S.t0)/1000),mm=Math.floor(secs/60)+":"+String(secs%60).padStart(2,"0"),hu=S.hintsUsed||0,fl=hu===0?3:hu===1?2:1,lamps="🪔".repeat(fl)+"·".repeat(3-fl);
 const d=new Date(),dn=Math.floor((d-new Date(2026,9,1))/864e5)+1,st=ST();
 const txt="Lamp · Daily verse #"+dn+"\n"+lamps+"  "+mm+(hu?", "+hu+" hint"+(hu>1?"s":""):", no hints")+"\n"+st.ref+" · "+streak().n+"-day lamp";
 sheet('<div class="kick">Daily verse #'+dn+' solved</div><h2>'+lamps+'</h2><div class="v">“'+st.verse.join(" ")+'”</div><div class="r">'+st.ref+' · KJV</div><div class="note"><b>Why it matters.</b> '+st.note+'</div><div class="share" id="shareTxt">'+txt.replace(/\n/g,"<br>")+'</div><button class="cta" id="copy">Copy result to share</button><button class="cta alt" id="next">Done</button>',()=>chooser());
 $("copy").onclick=()=>{const done=()=>toast("Copied. Paste it on Facebook or in a text");try{navigator.clipboard.writeText(txt).then(done,()=>{selectShare();toast("Select the result and copy it")})}catch(e){selectShare();toast("Select the result and copy it")}};
}
function selectShare(){const r=document.createRange();r.selectNodeContents($("shareTxt"));const s=getSelection();s.removeAllRanges();s.addRange(r)}
function go(i){SI=i;S={lv:0,oil:S?S.oil:3,found:[],bonusFound:[],hints:{},order:[],built:0,demoSeen:S&&S.demoSeen,hintsUsed:0,t0:Date.now()};start(true)}
function chooser(){
 const s=streak();
 sheet('<div class="kick">Lamp · level preview · all 149 stories</div><div class="lampcard"><div class="big '+(s.lit?"":"dim")+'">'+LAMPI+'</div><div><b>'+(s.n?(s.n===1?"Day 1":s.n+" days"):"Your lamp is out")+'</b><small>'+(s.lit?"Lit today. One rest day a week never breaks it.":s.n?"Play one level today to keep it burning.":"Play one level to light it.")+'</small></div></div><div class="week">'+weekRow()+'</div><h2 style="margin-top:14px">Choose a story</h2><input id="q" placeholder="Find a story, book or verse" style="width:100%;padding:10px 12px;border-radius:12px;border:1px solid #d9cfb4;font:inherit;margin:4px 0 8px;background:#fff">'+[STORIES.length-1,...STORIES.keys()].filter((i,k)=>k===0||i<STORIES.length-1).map(i=>{const st=STORIES[i];return '<button class="pick'+(st.daily?" daily":"")+'" data-i="'+i+'" data-s="'+(st.title+' '+st.book+' '+st.verses.map(v=>v.ref).join(' ')).toLowerCase()+'"><span style="background-image:url('+st.img+');background-color:#141A33"></span><div><b>'+(st.daily?"Today’s verse":st.n+'. '+st.title)+'</b><small>'+(st.daily?"One puzzle a day · "+st.ref:st.verses.map(v=>v.ref).join(', ')+' · '+st.levels.length+' levels'+(st.free?' · free':''))+'</small></div></button>'}).join("")+'<button class="test" id="sim">Test only: pretend I played the last 6 days</button><button class="cta alt" id="next">Close</button>',()=>{});
 document.querySelectorAll(".pick").forEach(b=>b.onclick=()=>{b.closest(".sheet").remove();go(+b.dataset.i)});$("q").oninput=e=>{const q=e.target.value.toLowerCase().trim();document.querySelectorAll(".pick").forEach(b=>b.style.display=!q||(b.dataset.s||'').includes(q)?'':'none')};
 $("sim").onclick=()=>{const a=getDays(),t=today();for(let i=1;i<=6;i++){const k=dayAdd(t,-i);if(i!==3&&!a.includes(k))a.push(k)}setDays(a);renderStreak();document.querySelector(".sheet").remove();chooser();toast("Pretend week added, with one rest day")};
}
function sheet(html,onNext){
 const sh=document.createElement("div");sh.className="sheet";sh.innerHTML='<div class="card" role="dialog" aria-modal="true">'+html+'</div>';$("app").appendChild(sh);
 sh.querySelector("#next").onclick=()=>{sh.remove();onNext()};sh.querySelector("#next").focus({preventScroll:true});
}
function start(fresh){VERSE=ST().verses[ST().levels[S.lv].v].words;LEVELS=ST().levels;if(LEVELS[S.lv].recall&&!S.order.length)S.built=LEVELS[S.lv].from||0;$("bg").style.backgroundImage="url("+ST().img+")";lit(S.lv/LEVELS.length,fresh);$("book").textContent="‹ "+ST().book;renderTop();renderBoard();LEVELS[S.lv].recall?renderRecall():renderWheelLevel()}
$("book").onclick=chooser;
renderStreak();go(0);chooser();
</script>
